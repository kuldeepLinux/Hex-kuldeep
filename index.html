<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexbytes - Security & DPDP Scanner</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --neon-green: #00ffcc;
            --neon-red: #ff3366;
            --neon-yellow: #fbbf24;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                linear-gradient(rgba(10, 14, 23, 0.9), rgba(10, 14, 23, 0.9)),
                url('https://www.transparenttextures.com/patterns/cubes.png');
        }

        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15), inset 0 0 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 700px;
            border: 1px solid #1f2937;
        }

        .header { text-align: center; border-bottom: 1px solid #1f2937; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); margin: 0; font-size: 26px; letter-spacing: 1px; }
        .header p { color: var(--text-muted); font-size: 13px; margin: 5px 0 0 0; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .tab-btn { background: transparent; color: var(--text-muted); border: 1px solid #374151; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: 0.3s; flex: 1; }
        .tab-btn:hover { border-color: var(--neon-green); color: var(--neon-green); }
        .tab-btn.active { background: rgba(0, 255, 204, 0.1); color: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0,255,204,0.2); }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 15px; background: #0a0e17; border: 1px solid #374151; color: var(--neon-green); border-radius: 6px; outline: none; font-family: inherit; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        button.scan-btn { padding: 12px 20px; background: transparent; color: var(--neon-green); border: 1px solid var(--neon-green); border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; }
        button.scan-btn:hover { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }

        /* Score Boards */
        .score-board { display: none; text-align: center; margin-bottom: 25px; padding: 20px; background: #0a0e17; border-radius: 8px; border: 1px dashed #374151; }
        .score-grade { font-size: 48px; font-weight: bold; margin: 0; text-shadow: 0 0 15px currentColor; }
        .grade-A { color: #00ffcc; }
        .grade-B { color: #a3e635; }
        .grade-C { color: #fbbf24; }
        .grade-F { color: #ff3366; }
        .score-text { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        .results-list { display: none; text-align: left; font-size: 14px; }
        .result-item { margin-bottom: 10px; padding: 10px 15px; background: #0a0e17; border-radius: 6px; border-left: 4px solid; display: flex; flex-direction: column; }
        .result-item.pass { border-left-color: var(--neon-green); }
        .result-item.fail { border-left-color: var(--neon-red); }
        .result-item.warn { border-left-color: var(--neon-yellow); }
        .header-name { font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .header-value { font-size: 11px; color: var(--text-muted); margin-top: 5px; word-break: break-all; }

        .raw-toggle { display: none; margin-top: 20px; text-align: center; }
        .raw-btn { font-size: 12px; padding: 8px 15px; border-color: var(--text-muted); color: var(--text-muted); background: transparent; border: 1px solid; border-radius: 6px; cursor: pointer; }
        .raw-btn:hover { background: var(--text-muted); color: var(--bg-dark); }
        pre { display: none; background: #000000; padding: 15px; border-radius: 6px; overflow-x: auto; color: #a3e635; font-size: 12px; margin-top: 15px; border: 1px solid #1f2937; white-space: pre-wrap; }

        .loader { display: none; color: var(--neon-green); text-align: center; font-weight: bold; }
        .error-msg { color: var(--neon-red); text-align: center; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>> Hexbytes.in</h1>
            <p>Security & Compliance Analyzer</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('headers')">Security Headers</button>
            <button class="tab-btn" onclick="switchTab('dpdp')">DPDP Compliance</button>
        </div>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com" onkeypress="if(event.key === 'Enter') startScan()">
            <button class="scan-btn" onclick="startScan()">SCAN</button>
        </div>

        <div id="loader" class="loader">[+] Analyzing Target... Please wait.</div>
        <div id="errorMsg" class="error-msg"></div>

        <!-- Security Headers Section -->
        <div id="headersSection" style="display: block;">
            <div id="headersScoreBoard" class="score-board">
                <h1 id="headersGradeDisplay" class="score-grade">?</h1>
                <p class="score-text">Score: <span id="headersScoreDisplay">0</span>/100</p>
            </div>
            <div id="headersResultsList" class="results-list"></div>
        </div>

        <!-- DPDP Section -->
        <div id="dpdpSection" style="display: none;">
            <div id="dpdpScoreBoard" class="score-board">
                <h1 id="dpdpGradeDisplay" class="score-grade">?</h1>
                <p class="score-text">Score: <span id="dpdpScoreDisplay">0</span>/100</p>
            </div>
            <div id="dpdpResultsList" class="results-list"></div>
        </div>

        <!-- Raw Data Toggle -->
        <div id="rawToggle" class="raw-toggle">
            <button class="raw-btn" onclick="toggleRaw()">View Raw Server Headers</button>
            <pre id="rawData"></pre>
        </div>

    </div>

    <script>
        let currentTab = 'headers';
        let currentUrl = '';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'headers') {
                document.getElementById('headersSection').style.display = 'block';
                document.getElementById('dpdpSection').style.display = 'none';
            } else {
                document.getElementById('headersSection').style.display = 'none';
                document.getElementById('dpdpSection').style.display = 'block';
                document.getElementById('rawToggle').style.display = 'none';
            }
            
            if(currentUrl) {
                document.getElementById('urlInput').value = currentUrl;
                startScan();
            }
        }

        function startScan() {
            if (currentTab === 'headers') {
                checkHeaders();
            } else {
                checkDPDP();
            }
        }

        // ==========================================
        // 1. SECURITY HEADERS LOGIC
        // ==========================================
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value.trim();
            if (!urlInput) return showError("Please enter a valid URL.");
            
            currentUrl = urlInput;
            let targetUrl = currentUrl;
            if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;

            resetUI();

            try {
                const apiUrl = `https://api.hackertarget.com/httpheaders/?q=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Network error");
                const textData = await response.text();

                if (textData.includes('error') || textData.includes('API count exceeded')) throw new Error("Target down or API limit reached.");

                document.getElementById('loader').style.display = 'none';

                const headersConfig = [
                    { name: 'content-security-policy', weight: 25 },
                    { name: 'strict-transport-security', weight: 25 },
                    { name: 'x-frame-options', weight: 15 },
                    { name: 'x-content-type-options', weight: 15 },
                    { name: 'referrer-policy', weight: 10 },
                    { name: 'permissions-policy', weight: 10 }
                ];

                let html = '';
                let score = 0;

                headersConfig.forEach(config => {
                    const regex = new RegExp(`^${config.name}:\\s*(.+)$`, 'im');
                    const match = textData.match(regex);
                    
                    if (match) {
                        score += config.weight;
                        html += `<div class="result-item pass"><div class="header-name"><span>✅ ${config.name}</span><span style="color: var(--neon-green); font-size: 12px;">+${config.weight} pts</span></div><div class="header-value">${match[1].trim()}</div></div>`;
                    } else {
                        html += `<div class="result-item fail"><div class="header-name"><span>❌ ${config.name}</span><span style="color: var(--neon-red); font-size: 12px;">0 pts</span></div><div class="header-value">Missing Header</div></div>`;
                    }
                });

                let grade = 'F', gradeClass = 'grade-F';
                if (score >= 90) { grade = 'A+'; gradeClass = 'grade-A'; }
                else if (score >= 80) { grade = 'A'; gradeClass = 'grade-A'; }
                else if (score >= 65) { grade = 'B'; gradeClass = 'grade-B'; }
                else if (score >= 50) { grade = 'C'; gradeClass = 'grade-C'; }

                document.getElementById('headersScoreDisplay').innerText = score;
                const gradeEl = document.getElementById('headersGradeDisplay');
                gradeEl.innerText = grade;
                gradeEl.className = `score-grade ${gradeClass}`;
                
                document.getElementById('headersScoreBoard').style.display = 'block';
                const listEl = document.getElementById('headersResultsList');
                listEl.innerHTML = html;
                listEl.style.display = 'block';

                document.getElementById('rawData').innerText = textData;
                document.getElementById('rawToggle').style.display = 'block';

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showError("Headers scan failed. Target might be down or blocking the scanner.");
            }
        }

        // ==========================================
        // 2. DPDP COMPLIANCE LOGIC (With Score)
        // ==========================================
        async function checkDPDP() {
            const urlInput = document.getElementById('urlInput').value.trim();
            if (!urlInput) return showError("Please enter a valid URL.");
            
            currentUrl = urlInput;
            let targetUrl = currentUrl;
            if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;

            resetUI();

            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();
                const htmlContent = data.contents.toLowerCase();

                document.getElementById('loader').style.display = 'none';

                // DPDP Checks with Weights
                const dpdpConfig = [
                    { title: "Privacy Policy Link", desc: "Is a Privacy Policy linked on the page?", found: htmlContent.includes('privacy policy') || htmlContent.includes('privacy-policy'), weight: 30 },
                    { title: "Consent Banner / Cookie Notice", desc: "Is there a cookie consent banner?", found: htmlContent.includes('cookie') || htmlContent.includes('consent'), weight: 30 },
                    { title: "Grievance Officer / DPO Contact", desc: "Is a Data Protection Officer contact provided?", found: htmlContent.includes('grievance') || htmlContent.includes('dpo'), weight: 25 },
                    { title: "Data Collection Forms", desc: "Does the page have forms asking for personal data?", found: htmlContent.includes('<form') && (htmlContent.includes('email') || htmlContent.includes('aadhaar')), weight: 15 }
                ];

                let html = '';
                let score = 0;

                dpdpConfig.forEach(check => {
                    if (check.found) {
                        score += check.weight;
                        html += `<div class="result-item pass"><div class="header-name"><span>✅ ${check.title}</span><span style="color: var(--neon-green); font-size: 12px;">+${check.weight} pts</span></div><div class="header-value">${check.desc} - <strong>Found</strong></div></div>`;
                    } else {
                        html += `<div class="result-item fail"><div class="header-name"><span>❌ ${check.title}</span><span style="color: var(--neon-red); font-size: 12px;">0 pts</span></div><div class="header-value">${check.desc} - <strong>Not Found</strong></div></div>`;
                    }
                });

                // Determine DPDP Grade
                let grade = 'F', gradeClass = 'grade-F';
                if (score >= 90) { grade = 'A+'; gradeClass = 'grade-A'; }
                else if (score >= 75) { grade = 'A'; gradeClass = 'grade-A'; }
                else if (score >= 60) { grade = 'B'; gradeClass = 'grade-B'; }
                else if (score >= 40) { grade = 'C'; gradeClass = 'grade-C'; }

                document.getElementById('dpdpScoreDisplay').innerText = score;
                const gradeEl = document.getElementById('dpdpGradeDisplay');
                gradeEl.innerText = grade;
                gradeEl.className = `score-grade ${gradeClass}`;
                document.getElementById('dpdpScoreBoard').style.display = 'block';

                html += `<div style="margin-top: 20px; padding: 15px; background: rgba(0,255,204,0.05); border-radius: 6px; border: 1px solid rgba(0,255,204,0.2);">
                    <p style="color: var(--text-muted); font-size: 12px; margin: 0;">
                        <strong>Note:</strong> Automated surface-level check. Full DPDP compliance requires backend data processing audits. 
                    </p>
                </div>`;

                const listEl = document.getElementById('dpdpResultsList');
                listEl.innerHTML = html;
                listEl.style.display = 'block';

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showError("DPDP scan failed. Target might be blocking the proxy or is down.");
            }
        }

        // ==========================================
        // HELPERS
        // ==========================================
        function resetUI() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('headersScoreBoard').style.display = 'none';
            document.getElementById('headersResultsList').style.display = 'none';
            document.getElementById('dpdpScoreBoard').style.display = 'none';
            document.getElementById('dpdpResultsList').style.display = 'none';
            document.getElementById('rawToggle').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.innerText = `[-] ${msg}`;
            errorEl.style.display = 'block';
            document.getElementById('loader').style.display = 'none';
        }

        function toggleRaw() {
            const rawData = document.getElementById('rawData');
            rawData.style.display = rawData.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
