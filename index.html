<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexbytes - Security Headers Scanner</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { text-shadow: 0 0 10px #00ffcc; }
        input {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            background: #0d1117;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
        }
        button {
            padding: 12px 25px;
            background: #00ffcc;
            color: #0d1117;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover { background: #00ccaa; box-shadow: 0 0 10px #00ffcc; }
        #results {
            margin-top: 25px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }
        .success { color: #00ff00; }
        .error { color: #ff3333; }
        .header-item { margin-bottom: 8px; }
        pre { background:#0d1117; padding:10px; border-radius:5px; overflow-x:auto; color:#fff; white-space: pre-wrap; word-wrap: break-word;}
    </style>
</head>
<body>

    <div class="container">
        <h2>> Hexbytes.in</h2>
        <p>Security Headers Scanner</p>
        
        <input type="text" id="urlInput" placeholder="https://example.com" onkeypress="if(event.key === 'Enter') checkHeaders()">
        <br>
        <button onclick="checkHeaders()">Scan Target</button>

        <div id="results"></div>
    </div>

    <script>
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!urlInput) {
                resultsDiv.innerHTML = '<p class="error">[-] Please enter a valid URL.</p>';
                return;
            }

            // Add https:// if missing
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            resultsDiv.innerHTML = '<p>[+] Scanning target... Please wait.</p>';

            try {
                // Using a free API that returns JSON with security headers grade
                // Alternative: AlertKick API (securityheaders.com API is deprecated)
                const apiUrl = `https://alertkick.com/api/tools/security-headers?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`API responded with status ${response.status}`);
                }

                const data = await response.json();

                // Check if the API returned a valid result
                if (data.error) {
                     resultsDiv.innerHTML = `<p class="error">[-] Error: ${data.error}</p>`;
                     return;
                }

                // Build result HTML
                let html = `<p class="success">[+] Scan Complete for: ${data.finalUrl || targetUrl}</p>`;
                html += `<p><strong>Grade:</strong> <span style="font-size: 20px; color: #ffff00;">${data.grade || 'N/A'}</span> (Score: ${data.score || 'N/A'})</p>`;
                
                if (data.checks && data.checks.length > 0) {
                    html += `<p><strong>Header Details:</strong></p>`;
                    data.checks.forEach(check => {
                        const statusIcon = check.status === 'present' ? '✅' : '❌';
                        const color = check.status === 'present' ? '#00ff00' : '#ff3333';
                        html += `<div class="header-item" style="color: ${color};">
                            ${statusIcon} <strong>${check.name}</strong>: ${check.status}
                            ${check.value ? `<br><span style="color: #aaa; font-size: 12px;">Value: ${check.value}</span>` : ''}
                        </div>`;
                    });
                } else {
                    // Fallback if checks array is missing
                    html += `<p>Raw response:</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Scan error:', error);
                resultsDiv.innerHTML = `<p class="error">[-] Scan failed. Possible reasons:</p>
                <ul style="color: #ff9999; font-size: 12px;">
                    <li>Target website is down or blocking scanners.</li>
                    <li>API rate limit reached. Please wait a moment and try again.</li>
                    <li>Network error. Check your internet connection.</li>
                </ul>
                <p style="font-size: 11px; color: #888;">Technical: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
