<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexbytes - Security Headers Scanner</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            text-shadow: 0 0 10px #00ffcc;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            background: #0d1117;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background: #00ffcc;
            color: #0d1117;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00ccaa;
            box-shadow: 0 0 10px #00ffcc;
        }
        #results {
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
        }
        .success { color: #00ff00; }
        .error { color: #ff3333; }
    </style>
</head>
<body>

    <div class="container">
        <h2>> Hexbytes.in</h2>
        <p>Security Headers Scanner</p>
        
        <input type="text" id="urlInput" placeholder="https://example.com">
        <br>
        <button onclick="checkHeaders()">Scan Target</button>

        <div id="results"></div>
    </div>

    <script>
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!urlInput) {
                resultsDiv.innerHTML = '<p class="error">[-] Please enter a valid URL.</p>';
                return;
            }

            resultsDiv.innerHTML = '<p>[+] Scanning target... Please wait.</p>';

            try {
                // Note: Browsers restrict reading some headers due to CORS. 
                // Hum ek public CORS proxy use kar rahe hain headers fetch karne ke liye.
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(urlInput);
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Fetching headers directly in browser is tricky, so we simulate basic checks here.
                // Real tool would need a backend. For HTML, we use a different API approach.
                
                // Security headers check API (Third party free API)
                const scanRes = await fetch(`https://securityheaders.com/?q=${encodeURIComponent(urlInput)}&followRedirects=on`);
                
                // Since we can't scrape securityheaders.com due to CORS, let's use a simpler API.
                const apiRes = await fetch(`https://api.hackertarget.com/httpheaders/?q=${encodeURIComponent(urlInput)}`);
                const textData = await apiRes.text();

                if(textData.includes('error')) {
                     resultsDiv.innerHTML = `<p class="error">[-] Error: Target is not reachable or blocking scanners.</p>`;
                     return;
                }

                // Displaying raw headers as result
                resultsDiv.innerHTML = `<p class="success">[+] Scan Complete. Raw Headers:</p>
                <pre style="background:#0d1117; padding:10px; border-radius:5px; overflow-x:auto; color:#fff;">${textData}</pre>`;

            } catch (error) {
                resultsDiv.innerHTML = `<p class="error">[-] Error scanning URL. Check if website is live.</p>`;
            }
        }
    </script>
</body>
</html>
