<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexbytes - Security Headers Scanner</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --neon-green: #00ffcc;
            --neon-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                linear-gradient(rgba(10, 14, 23, 0.9), rgba(10, 14, 23, 0.9)),
                url('https://www.transparenttextures.com/patterns/cubes.png');
        }

        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15), inset 0 0 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 650px;
            border: 1px solid #1f2937;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 5px 0 0 0;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            background: #0a0e17;
            border: 1px solid #374151;
            color: var(--neon-green);
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        button {
            padding: 12px 20px;
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* Score Board Styles */
        .score-board {
            display: none;
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: #0a0e17;
            border-radius: 8px;
            border: 1px dashed #374151;
        }

        .score-grade {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 15px currentColor;
        }

        .grade-A { color: #00ffcc; }
        .grade-B { color: #a3e635; }
        .grade-C { color: #fbbf24; }
        .grade-F { color: #ff3366; }
        
        .score-text {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Results List */
        .results-list {
            display: none;
            text-align: left;
            font-size: 14px;
        }

        .result-item {
            margin-bottom: 10px;
            padding: 10px 15px;
            background: #0a0e17;
            border-radius: 6px;
            border-left: 4px solid;
            display: flex;
            flex-direction: column;
        }

        .result-item.pass { border-left-color: var(--neon-green); }
        .result-item.fail { border-left-color: var(--neon-red); }

        .header-name {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-value {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            word-break: break-all;
        }

        /* Raw Data Accordion */
        .raw-toggle {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .raw-btn {
            font-size: 12px;
            padding: 8px 15px;
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        .raw-btn:hover {
            background: var(--text-muted);
            color: var(--bg-dark);
            box-shadow: none;
        }

        pre {
            display: none;
            background: #000000;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #a3e635;
            font-size: 12px;
            margin-top: 15px;
            border: 1px solid #1f2937;
            white-space: pre-wrap;
        }

        .loader {
            display: none;
            color: var(--neon-green);
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>> Hexbytes.in</h1>
            <p>Security Headers Analyzer</p>
        </div>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com" onkeypress="if(event.key === 'Enter') checkHeaders()">
            <button onclick="checkHeaders()">SCAN</button>
        </div>

        <div id="loader" class="loader">[+] Analyzing Target... Please wait.</div>
        <div id="errorMsg" style="color: var(--neon-red); text-align: center; display: none; margin-bottom: 15px;"></div>

        <!-- Score Display -->
        <div id="scoreBoard" class="score-board">
            <h1 id="gradeDisplay" class="score-grade">?</h1>
            <p class="score-text">Score: <span id="scoreDisplay">0</span>/100</p>
        </div>

        <!-- Detailed List -->
        <div id="resultsList" class="results-list"></div>

        <!-- Raw Data Toggle -->
        <div id="rawToggle" class="raw-toggle">
            <button class="raw-btn" onclick="toggleRaw()">View Raw Server Headers</button>
            <pre id="rawData"></pre>
        </div>

    </div>

    <script>
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value.trim();
            
            if (!urlInput) {
                showError("Please enter a valid URL.");
                return;
            }

            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            // Reset UI
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('scoreBoard').style.display = 'none';
            document.getElementById('resultsList').style.display = 'none';
            document.getElementById('rawToggle').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                const apiUrl = `https://api.hackertarget.com/httpheaders/?q=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("Network error");
                const textData = await response.text();

                if (textData.includes('error') || textData.includes('API count exceeded')) {
                     throw new Error("Target down or API limit reached.");
                }

                document.getElementById('loader').style.display = 'none';

                // Headers to check with their weight for scoring
                const headersConfig = [
                    { name: 'content-security-policy', weight: 25 },
                    { name: 'strict-transport-security', weight: 25 },
                    { name: 'x-frame-options', weight: 15 },
                    { name: 'x-content-type-options', weight: 15 },
                    { name: 'referrer-policy', weight: 10 },
                    { name: 'permissions-policy', weight: 10 }
                ];

                let html = '';
                let score = 0;

                headersConfig.forEach(config => {
                    const regex = new RegExp(`^${config.name}:\\s*(.+)$`, 'im');
                    const match = textData.match(regex);
                    
                    if (match) {
                        score += config.weight;
                        html += `
                        <div class="result-item pass">
                            <div class="header-name">
                                <span>✅ ${config.name}</span>
                                <span style="color: var(--neon-green); font-size: 12px;">+${config.weight} pts</span>
                            </div>
                            <div class="header-value">${match[1].trim()}</div>
                        </div>`;
                    } else {
                        html += `
                        <div class="result-item fail">
                            <div class="header-name">
                                <span>❌ ${config.name}</span>
                                <span style="color: var(--neon-red); font-size: 12px;">0 pts</span>
                            </div>
                            <div class="header-value">Missing Header</div>
                        </div>`;
                    }
                });

                // Determine Grade based on Score
                let grade = 'F';
                let gradeClass = 'grade-F';

                if (score >= 90) { grade = 'A+'; gradeClass = 'grade-A'; }
                else if (score >= 80) { grade = 'A'; gradeClass = 'grade-A'; }
                else if (score >= 65) { grade = 'B'; gradeClass = 'grade-B'; }
                else if (score >= 50) { grade = 'C'; gradeClass = 'grade-C'; }

                // Update UI
                document.getElementById('scoreDisplay').innerText = score;
                const gradeEl = document.getElementById('gradeDisplay');
                gradeEl.innerText = grade;
                gradeEl.className = `score-grade ${gradeClass}`;
                
                document.getElementById('scoreBoard').style.display = 'block';
                
                const listEl = document.getElementById('resultsList');
                listEl.innerHTML = html;
                listEl.style.display = 'block';

                document.getElementById('rawData').innerText = textData;
                document.getElementById('rawToggle').style.display = 'block';

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showError("Scan failed. Target might be down or blocking the scanner.");
                console.error(error);
            }
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.innerText = `[-] ${msg}`;
            errorEl.style.display = 'block';
        }

        function toggleRaw() {
            const rawData = document.getElementById('rawData');
            if (rawData.style.display === 'block') {
                rawData.style.display = 'none';
            } else {
                rawData.style.display = 'block';
            }
        }
    </script>
</body>
</html>
