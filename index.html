<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexbytes - Security Headers Scanner</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { 
            text-shadow: 0 0 10px #00ffcc; 
            font-size: 24px;
        }
        input {
            width: 85%;
            padding: 12px;
            margin: 15px 0;
            background: #0d1117;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }
        button {
            padding: 12px 25px;
            background: #00ffcc;
            color: #0d1117;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }
        button:hover { 
            background: #00ccaa; 
            box-shadow: 0 0 15px #00ffcc; 
        }
        #results {
            margin-top: 25px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        .success { color: #00ff00; font-weight: bold;}
        .error { color: #ff3333; }
        .header-item { 
            margin-bottom: 8px; 
            padding: 8px;
            background: #0d1117;
            border-radius: 5px;
            border-left: 3px solid #00ffcc;
        }
        pre { 
            background:#0d1117; 
            padding:12px; 
            border-radius:5px; 
            overflow-x:auto; 
            color:#aaa; 
            white-space: pre-wrap; 
            word-wrap: break-word;
            font-size: 12px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>> Hexbytes.in</h2>
        <p>Security Headers Scanner</p>
        
        <input type="text" id="urlInput" placeholder="https://example.com" onkeypress="if(event.key === 'Enter') checkHeaders()">
        <br>
        <button onclick="checkHeaders()">Scan Target</button>

        <div id="results"></div>
    </div>

    <script>
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!urlInput) {
                resultsDiv.innerHTML = '<p class="error">[-] Please enter a valid URL.</p>';
                return;
            }

            // Agar user ne http ya https nahi dala, toh auto-add karein
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            resultsDiv.innerHTML = '<p>[+] Scanning target... Please wait.</p>';

            try {
                // HackerTarget API use kar rahe hain jo raw headers return karti hai
                const apiUrl = `https://api.hackertarget.com/httpheaders/?q=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                const textData = await response.text();

                // Agar API limit khatam ho ya target down ho
                if (textData.includes('error') || textData.includes('API count exceeded')) {
                     resultsDiv.innerHTML = `<p class="error">[-] API Error: Target website is down or API limit reached. Please try again later.</p>`;
                     return;
                }

                // Check karne ke liye important headers ki list
                const headersToCheck = [
                    'content-security-policy',
                    'strict-transport-security',
                    'x-frame-options',
                    'x-content-type-options',
                    'referrer-policy',
                    'permissions-policy'
                ];

                let html = `<p class="success">[+] Scan Complete for: ${targetUrl}</p><br>`;
                let passCount = 0;

                // Headers ko check karna
                headersToCheck.forEach(header => {
                    // Regex se raw text me header dhundhna
                    const regex = new RegExp(`^${header}:\\s*(.+)$`, 'im');
                    const match = textData.match(regex);
                    
                    if (match) {
                        passCount++;
                        html += `<div class="header-item" style="border-left-color: #00ff00;">
                            <span style="color: #00ff00;">✅ <strong>${header}</strong></span>
                            <br><span style="color: #888; font-size: 11px;">Value: ${match[1].trim()}</span>
                        </div>`;
                    } else {
                        html += `<div class="header-item" style="border-left-color: #ff3333;">
                            <span style="color: #ff3333;">❌ <strong>${header}</strong> (Missing)</span>
                        </div>`;
                    }
                });

                // Ek chhota sa summary score
                html = `<p style="color: #ffff00;">Score: ${passCount}/${headersToCheck.length} Headers Found</p>` + html;

                // Niche raw data dikhana
                html += `<p style="margin-top: 20px; font-size: 12px; color: #888;">[+] Raw Server Response:</p>`;
                html += `<pre>${textData}</pre>`;

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Scan error:', error);
                resultsDiv.innerHTML = `<p class="error">[-] Scan failed. Possible reasons:</p>
                <ul style="color: #ff9999; font-size: 12px;">
                    <li>Target website is down or blocking requests.</li>
                    <li>Network error. Check your internet connection.</li>
                    <li>Browser blocked the request (Adblocker issue).</li>
                </ul>`;
            }
        }
    </script>
</body>
</html>
