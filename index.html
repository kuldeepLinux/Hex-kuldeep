<script>
        async function checkHeaders() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!urlInput) {
                resultsDiv.innerHTML = '<p class="error">[-] Please enter a valid URL.</p>';
                return;
            }

            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            resultsDiv.innerHTML = '<p>[+] Scanning target... Please wait.</p>';

            try {
                // Using a reliable free API for security headers
                const apiUrl = `https://api.hackertarget.com/httpheaders/?q=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`API responded with status ${response.status}`);
                }

                const textData = await response.text();

                if (textData.includes('error') || textData.includes('API count exceeded')) {
                     resultsDiv.innerHTML = `<p class="error">[-] Error: ${textData}. Please try again after a minute.</p>`;
                     return;
                }

                // Simple logic to detect headers from raw text
                const headersToCheck = [
                    'content-security-policy',
                    'strict-transport-security',
                    'x-frame-options',
                    'x-content-type-options',
                    'referrer-policy',
                    'permissions-policy'
                ];

                let html = `<p class="success">[+] Scan Complete for: ${targetUrl}</p>`;
                
                headersToCheck.forEach(header => {
                    // Regex to find header in the raw text (case insensitive)
                    const regex = new RegExp(`^${header}:\\s*(.+)$`, 'im');
                    const match = textData.match(regex);
                    
                    if (match) {
                        html += `<div class="header-item" style="color: #00ff00;">
                            ✅ <strong>${header}</strong> is present.
                            <br><span style="color: #aaa; font-size: 12px;">Value: ${match[1].trim()}</span>
                        </div>`;
                    } else {
                        html += `<div class="header-item" style="color: #ff3333;">
                            ❌ <strong>${header}</strong> is missing.
                        </div>`;
                    }
                });

                // Show raw headers below
                html += `<p style="margin-top: 15px; font-size: 12px; color: #888;">Raw Headers from Server:</p>`;
                html += `<pre>${textData}</pre>`;

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Scan error:', error);
                resultsDiv.innerHTML = `<p class="error">[-] Scan failed. Technical reason: ${error.message}</p>
                <p style="font-size: 12px; color: #888;">Tip: If this keeps happening, the API might be temporarily down. Please try after some time.</p>`;
            }
        }
    </script>
